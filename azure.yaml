# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: jimmy
metadata:
  template: jimmy-azure@0.1.0
services:
  jimmy:
    project: .
    language: python
    host: containerapp
    docker:
      path: Dockerfile.jimmy
      remoteBuild: true
      # Public HTTPS targetPort must match dashboard listen port
      # (HERMES_DASHBOARD_PORT / default 9119 in image).
infra: ./infra
